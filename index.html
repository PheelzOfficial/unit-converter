<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techie Villa | Premium Unit Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <meta name="description" content="A premium, dark-mode unit converter for length, weight, and temperature.">
</head>

<body>
    <div class="glass-background"></div>

    <main class="app-container">
        <header class="app-header">
            <h1>Techie Villa <span class="gradient-text">Converter</span></h1>
            <p>Precise. Fluid. Premium.</p>
        </header>

        <section class="converter-card">
            <nav class="category-tabs">
                <button class="tab-btn active" data-category="length">Length</button>
                <button class="tab-btn" data-category="weight">Weight</button>
                <button class="tab-btn" data-category="temperature">Temperature</button>
            </nav>

            <div class="inputs-container">
                <div class="input-group">
                    <label for="inputValue">Value to convert</label>
                    <input type="number" id="inputValue" placeholder="Enter value..." step="any">
                </div>

                <div class="selection-grid">
                    <div class="input-group">
                        <label for="fromUnit">From</label>
                        <select id="fromUnit"></select>
                    </div>
                    <div class="input-group">
                        <label for="toUnit">To</label>
                        <select id="toUnit"></select>
                    </div>
                </div>

                <button id="convertBtn" class="primary-btn">Convert Now</button>
                <button id="resetBtn" class="secondary-btn">Reset</button>
            </div>

            <div class="result-section" id="resultContainer">
                <div class="result-label" id="resultLabel">Result of your calculation</div>
                <div class="result-value" id="resultDisplay">--</div>
            </div>
        </section>

        <footer class="app-footer">
            <p>© 2026 Techie Villa Labs</p>
            <p>Built with ❤️ by <a href="https://github.com/PheelzOfficial">PheelzOfficial</a></p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>

</html>
